<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#090d16">
    <title>RAY 麻將個人戰績分析系統 Pro</title>
    <style>
        html, body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100% !important;
            min-height: 100% !important;
            min-height: 100dvh !important;
            overflow-x: hidden !important;
            background-color: #090d16 !important;
            -webkit-tap-highlight-color: transparent;
        }
        *, *::before, *::after { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .sml-border { border: 1px solid rgba(255, 255, 255, 0.1); }
        .pattern-chip.active { background-color: #00ff88; color: #000; font-weight: bold; border-color: #00ff88; }
        text, button, input, select { -webkit-text-size-adjust: 100%; }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { smlBg: '#090d16', smlCard: '#111827', smlGreen: '#00ff88', smlRed: '#ff4d4d', smlCyan: '#00e5ff', smlAmber: '#f59e0b' }
                }
            }
        }
    </script>
</head>
<body class="bg-smlBg text-gray-100 flex flex-col min-h-screen w-full">
    <div class="w-full flex-grow pb-12">
        <nav class="bg-smlCard border-b border-gray-800 px-2 py-3 sticky top-0 z-40 shadow-lg w-full">
            <div class="w-full max-w-4xl mx-auto flex justify-between items-center">
                <div class="flex items-center space-x-2">
                    <span class="text-xl sm:text-2xl font-black italic tracking-wider text-smlGreen">RAY</span>
                    <span class="text-[10px] sm:text-xs bg-gray-800 text-smlCyan px-2 py-0.5 rounded border border-smlCyan/30 whitespace-nowrap">麻將戰績簿 Pro</span>
                </div>
                <button type="button" id="btnClearAll" class="px-2.5 py-1.5 text-xs bg-red-950 text-red-400 font-bold rounded-lg border border-red-800/80 transition flex items-center space-x-1 cursor-pointer">
                    <i class="fa-solid fa-triangle-exclamation text-xs"></i>
                    <span id="clearAllText" class="whitespace-nowrap">清空全部</span>
                </button>
            </div>
            
            <div class="w-full max-w-4xl mx-auto flex mt-2.5 bg-gray-900/90 p-1 rounded-xl border border-gray-800 text-xs font-bold">
                <button id="btn-tab-analysis" onclick="window.switchTab('tab-analysis')" class="tab-btn flex-1 py-2.5 rounded-lg text-center transition flex items-center justify-center space-x-1 text-smlGreen bg-gray-800 border-b-2 border-smlGreen">
                    <i class="fa-solid fa-chart-pie"></i><span class="whitespace-nowrap">數據圖表</span>
                </button>
                <button id="btn-tab-input" onclick="window.switchTab('tab-input')" class="tab-btn flex-1 py-2.5 rounded-lg text-center transition flex items-center justify-center space-x-1 text-gray-400 border-b-2 border-transparent">
                    <i class="fa-solid fa-pen-to-square"></i><span class="whitespace-nowrap">戰績錄入</span>
                </button>
                <button id="btn-tab-history" onclick="window.switchTab('tab-history')" class="tab-btn flex-1 py-2.5 rounded-lg text-center transition flex items-center justify-center space-x-1 text-gray-400 border-b-2 border-transparent">
                    <i class="fa-solid fa-list-check"></i><span class="whitespace-nowrap">對局歷史</span>
                </button>
            </div>
        </nav>
        
        <div class="w-full max-w-4xl mx-auto px-2 sm:px-4 mt-3">
            <!-- 分頁 1：數據分析 -->
            <div id="tab-analysis" class="tab-content space-y-4">
                <section class="bg-smlCard/90 rounded-2xl p-3.5 sm:p-4 sml-border space-y-4">
                    <div class="flex flex-col items-center space-y-3 border-b border-gray-800 pb-4">
                        <div class="w-16 h-16 rounded-2xl border-2 border-smlGreen/50 bg-gray-900 flex items-center justify-center shadow-lg">
                            <i class="fa-solid fa-user-ninja text-2xl text-smlGreen"></i>
                        </div>
                        <h2 class="text-sm font-black text-white">RAY 戰績總覽面板</h2>
                    </div>
                    
                    <div class="space-y-3">
                        <div>
                            <div class="text-[11px] text-smlGreen font-bold mb-1">大局表現 CORE STATS</div>
                            <div class="grid grid-cols-4 gap-1 text-center bg-gray-900/60 p-2 rounded-xl border border-gray-800">
                                <div><div class="text-[9px] text-gray-400 whitespace-nowrap">總雀數</div><div id="statTotalGames" class="text-xs sm:text-sm font-bold text-white">0</div></div>
                                <div><div class="text-[9px] text-gray-400 whitespace-nowrap">平均順位</div><div id="statAvgRank" class="text-xs sm:text-sm font-bold text-smlGreen">0.00</div></div>
                                <div><div class="text-[9px] text-gray-400 whitespace-nowrap">運氣值</div><div id="statLuckValue" class="text-xs sm:text-sm font-bold text-smlCyan">100</div></div>
                                <div><div class="text-[9px] text-gray-400 whitespace-nowrap">最高點數</div><div id="statMaxWinPts" class="text-xs sm:text-sm font-bold text-smlGreen">0P</div></div>
                            </div>
                        </div>
                        
                        <div>
                            <div class="text-[11px] text-smlGreen font-bold mb-1">生涯對局計數 CAREER TOTALS</div>
                            <div class="grid grid-cols-4 gap-1 text-center bg-gray-900/60 p-2 rounded-xl border border-gray-800">
                                <div><div class="text-[9px] text-gray-400 whitespace-nowrap">生涯胡牌</div><div id="statCareerHu" class="text-xs sm:text-sm font-bold text-smlCyan">0</div></div>
                                <div><div class="text-[9px] text-gray-400 whitespace-nowrap">生涯自摸</div><div id="statCareerZimo" class="text-xs sm:text-sm font-bold text-smlGreen">0</div></div>
                                <div><div class="text-[9px] text-gray-400 whitespace-nowrap">生涯被自摸</div><div id="statCareerBeZimo" class="text-xs sm:text-sm font-bold text-smlAmber">0</div></div>
                                <div><div class="text-[9px] text-gray-400 whitespace-nowrap">生涯放槍</div><div id="statCareerGun" class="text-xs sm:text-sm font-bold text-smlRed">0</div></div>
                            </div>
                        </div>
                    </div>
                </section>
                
                <section class="space-y-4">
                    <div class="bg-smlCard p-3.5 rounded-2xl sml-border">
                        <h3 class="text-xs font-bold text-white mb-2 flex items-center">
                            <i class="fa-solid fa-chart-line text-smlGreen mr-1.5"></i> 累計總金額 (NTD)
                        </h3>
                        <div class="h-40 sm:h-48"><canvas id="moneyLineChart"></canvas></div>
                    </div>
                    <div class="bg-smlCard p-3.5 rounded-2xl sml-border">
                        <h3 class="text-xs font-bold text-white mb-2 flex items-center">
                            <i class="fa-solid fa-arrow-trend-up text-smlCyan mr-1.5"></i> 累計總點數
                        </h3>
                        <div class="h-40 sm:h-48"><canvas id="pointsLineChart"></canvas></div>
                    </div>
                </section>
            </div>
            
            <!-- 分頁 2：戰績錄入 -->
            <div id="tab-input" class="tab-content hidden space-y-4">
                <div class="bg-gradient-to-b from-gray-900 to-smlCard sml-border rounded-2xl p-3.5 space-y-3">
                    <div class="flex justify-between items-center border-b border-gray-800 pb-2">
                        <h3 class="text-xs sm:text-sm font-extrabold text-smlCyan flex items-center whitespace-nowrap">
                            <i class="fa-solid fa-bolt mr-1.5"></i> 邊打邊記小助手
                        </h3>
                        <div class="flex space-x-1.5">
                            <button type="button" onclick="window.undoLastLiveHand()" class="text-[10px] bg-gray-800 active:bg-gray-700 text-smlCyan px-2 py-1 rounded-lg border border-gray-700 font-bold whitespace-nowrap">
                                <i class="fa-solid fa-rotate-left mr-1"></i>撤回
                            </button>
                            <button type="button" onclick="window.resetLiveTracker()" class="text-[10px] bg-red-950 active:bg-red-900 text-smlRed px-2 py-1 rounded-lg border border-red-800/80 font-bold whitespace-nowrap">
                                <i class="fa-solid fa-trash-can mr-1"></i>重置
                            </button>
                        </div>
                    </div>
                    
                    <!-- 玩家姓名與莊家系統設定卡片 -->
                    <div class="bg-gray-900/90 p-2.5 rounded-xl border border-gray-800 space-y-2">
                        <div class="text-[11px] font-bold text-smlGreen flex justify-between items-center">
                            <span><i class="fa-solid fa-users mr-1"></i> 玩家設定與莊家狀態</span>
                        </div>
                        <div class="grid grid-cols-3 gap-1.5 text-xs">
                            <div>
                                <label class="text-[9px] text-gray-400">下家</label>
                                <input type="text" id="oppName1" value="下家" class="w-full bg-gray-950 border border-gray-700 rounded p-1 text-white text-xs outline-none focus:border-smlCyan">
                            </div>
                            <div>
                                <label class="text-[9px] text-gray-400">對家</label>
                                <input type="text" id="oppName2" value="對家" class="w-full bg-gray-950 border border-gray-700 rounded p-1 text-white text-xs outline-none focus:border-smlCyan">
                            </div>
                            <div>
                                <label class="text-[9px] text-gray-400">上家</label>
                                <input type="text" id="oppName3" value="上家" class="w-full bg-gray-950 border border-gray-700 rounded p-1 text-white text-xs outline-none focus:border-smlCyan">
                            </div>
                        </div>
                        
                        <div class="flex items-center justify-between text-xs pt-1 border-t border-gray-800">
                            <div class="flex items-center space-x-1">
                                <span class="text-gray-400 text-[10px]">RAY 莊家狀態：</span>
                                <button type="button" id="btnRayDealer" onclick="window.toggleRayDealer(true)" class="px-2 py-1 rounded bg-smlGreen text-black font-bold">莊家</button>
                                <button type="button" id="btnRayNonDealer" onclick="window.toggleRayDealer(false)" class="px-2 py-1 rounded bg-gray-800 text-gray-400 font-bold">閒家</button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-2 bg-gray-950/60 p-2 rounded-xl border border-gray-800/80">
                        <div>
                            <label class="block text-[10px] text-gray-400 mb-0.5">底 / 台 (點數)</label>
                            <div class="flex space-x-1">
                                <input type="number" id="liveBasePtsInput" value="1" onchange="window.syncBaseTaiToForm()" class="w-1/2 bg-gray-900 border border-gray-700 rounded-lg p-1.5 text-xs text-white text-center font-mono">
                                <input type="number" id="liveTaiPtsInput" value="1" onchange="window.syncBaseTaiToForm()" class="w-1/2 bg-gray-900 border border-gray-700 rounded-lg p-1.5 text-xs text-white text-center font-mono">
                            </div>
                        </div>
                        <div>
                            <label class="block text-[10px] text-gray-400 mb-0.5">底 / 台 (NTD)</label>
                            <div class="flex space-x-1">
                                <input type="number" id="liveBaseMoneyInput" value="100" onchange="window.syncBaseTaiToForm()" class="w-1/2 bg-gray-900 border border-gray-700 rounded-lg p-1.5 text-xs text-white text-center font-mono">
                                <input type="number" id="liveTaiMoneyInput" value="20" onchange="window.syncBaseTaiToForm()" class="w-1/2 bg-gray-900 border border-gray-700 rounded-lg p-1.5 text-xs text-white text-center font-mono">
                            </div>
                        </div>
                    </div>
                    <div class="space-y-2">
                        <div>
                            <div class="flex justify-between items-center mb-0.5">
                                <label class="block text-[10px] text-gray-400">該把台數 (可手動修改)</label>
                                <span id="autoTaiBadge" class="text-[10px] text-smlGreen font-bold font-mono">0 台</span>
                            </div>
                            <input type="number" id="liveTaiInput" placeholder="0" min="0" value="0" oninput="window.onManualTaiInput()" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-xs text-smlGreen font-black outline-none font-mono text-center">
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-[10px] text-smlGreen mb-0.5">胡哪張牌</label>
                                <select id="liveWinTileSelect" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-xs text-white outline-none focus:border-smlCyan"><option value="">-- 選牌 --</option></select>
                            </div>
                            <div>
                                <label class="block text-[10px] text-smlRed mb-0.5">放槍放哪張</label>
                                <select id="liveGunTileSelect" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-xs text-white outline-none focus:border-smlCyan"><option value="">-- 選牌 --</option></select>
                            </div>
                        </div>
                    </div>
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label class="block text-[10px] text-gray-400">牌型選擇 (分類歸納)</label>
                            <button type="button" id="btnTaiMode" onclick="window.toggleTaiMode()" class="text-[10px] bg-gray-800 text-smlCyan px-2 py-0.5 rounded border border-gray-700 font-bold">切換: 目前為手動輸入</button>
                        </div>
                        <div id="patternsContainer" class="space-y-2 max-h-48 overflow-y-auto p-2 bg-gray-950 rounded-xl border border-gray-800"></div>
                    </div>
                    <!-- RAY 勝負按鈕 -->
                    <div class="text-[10px] text-gray-400 font-bold">RAY 戰績結算按鈕：</div>
                    <div class="grid grid-cols-2 gap-2">
                        <button type="button" onclick="window.addLiveHand('zimo')" class="py-2.5 bg-emerald-950 active:bg-emerald-800 text-smlGreen border border-smlGreen/50 font-black rounded-xl text-xs shadow">+ RAY 自摸</button>
                        <button type="button" onclick="window.addLiveHand('hu')" class="py-2.5 bg-cyan-950 active:bg-cyan-800 text-smlCyan border border-smlCyan/50 font-black rounded-xl text-xs shadow">+ RAY 胡牌</button>
                        <button type="button" onclick="window.addLiveHand('beZimo')" class="py-2.5 bg-amber-950 active:bg-amber-800 text-smlAmber border border-smlAmber/50 font-black rounded-xl text-xs shadow">- RAY 被自摸</button>
                        <button type="button" onclick="window.addLiveHand('gun')" class="py-2.5 bg-red-950 active:bg-red-800 text-smlRed border border-smlRed/50 font-black rounded-xl text-xs shadow">- RAY 放槍</button>
                    </div>
                    <div class="grid grid-cols-2 gap-2 pt-0.5">
                        <button type="button" onclick="window.addLiveHand('draw')" class="py-2 bg-gray-800 active:bg-gray-700 text-smlCyan border border-smlCyan/30 font-bold rounded-xl text-xs shadow">流局 / 無事發生</button>
                    </div>
                    <div class="bg-gray-950/90 p-2 rounded-xl text-[11px] text-center border border-gray-800" id="liveSummary">
                        手數: <span class="text-white font-bold">0</span> | 點數: <span class="text-smlCyan font-bold">0P</span> | 金額: <span class="text-smlGreen font-bold">$0</span>
                    </div>
                    <div id="liveHandsList" class="space-y-1.5 max-h-40 overflow-y-auto pr-1">
                        <div class="text-center text-gray-500 py-2 text-xs">尚未開始紀錄</div>
                    </div>
                </div>
                <div class="bg-smlCard sml-border rounded-2xl p-4 space-y-3">
                    <div class="border-b border-gray-800 pb-2 flex justify-between items-center">
                        <h3 class="text-xs sm:text-sm font-bold text-smlGreen flex items-center">
                            <i class="fa-solid fa-floppy-disk mr-1.5"></i> 結算並儲存此局
                        </h3>
                        <span class="text-[9px] bg-gray-800 text-gray-400 px-1.5 py-0.5 rounded whitespace-nowrap">數據自動同步</span>
                    </div>
                    
                    <form id="recordForm" onsubmit="window.saveRecord(event)" class="space-y-3 text-xs">
                        <div>
                            <label class="block text-gray-400 mb-0.5">日期</label>
                            <input type="date" id="inputDate" required class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-white focus:border-smlGreen outline-none">
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-gray-400 mb-0.5">底/台 (點數)</label>
                                <div class="flex space-x-1">
                                    <input type="number" id="inputBasePts" placeholder="底" required class="w-1/2 bg-gray-900 border border-gray-700 rounded-lg p-2 text-white font-mono">
                                    <input type="number" id="inputTaiPts" placeholder="台" required class="w-1/2 bg-gray-900 border border-gray-700 rounded-lg p-2 text-white font-mono">
                                </div>
                            </div>
                            <div>
                                <label class="block text-gray-400 mb-0.5">底/台 (NTD)</label>
                                <div class="flex space-x-1">
                                    <input type="number" id="inputBaseMoney" placeholder="底" required class="w-1/2 bg-gray-900 border border-gray-700 rounded-lg p-2 text-white font-mono">
                                    <input type="number" id="inputTaiMoney" placeholder="台" required class="w-1/2 bg-gray-900 border border-gray-700 rounded-lg p-2 text-white font-mono">
                                </div>
                            </div>
                        </div>
                        <div class="grid grid-cols-3 gap-2">
                            <div>
                                <label class="block text-gray-400 mb-0.5">順位</label>
                                <select id="inputRank" required class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-white outline-none">
                                    <option value="1">1 位</option>
                                    <option value="2">2 位</option>
                                    <option value="3">3 位</option>
                                    <option value="4">4 位</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-gray-400 mb-0.5">總金額</label>
                                <input type="number" id="inputMoney" placeholder="NTD" required class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-white font-mono">
                            </div>
                            <div>
                                <label class="block text-gray-400 mb-0.5">總點數</label>
                                <input type="number" id="inputPoints" placeholder="P" required class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-white font-mono">
                            </div>
                        </div>
                        <div class="grid grid-cols-5 gap-1 hidden">
                            <!-- 隱藏但保留值以供後台計算 -->
                            <input type="number" id="inputTotalHands" value="0">
                            <input type="number" id="inputHu" value="0">
                            <input type="number" id="inputZimo" value="0">
                            <input type="number" id="inputBeZimo" value="0">
                            <input type="number" id="inputGun" value="0">
                            <input type="number" id="inputMaxWinPts" value="0">
                            <input type="number" id="inputMaxWinMoney" value="0">
                        </div>
                        <div>
                            <label class="block text-gray-400 mb-0.5">對手名字</label>
                            <input type="text" id="inputOpponents" placeholder="自動帶入：下家, 對家, 上家" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-white">
                        </div>
                        <div class="pt-1">
                            <button type="submit" class="w-full py-3 bg-smlGreen active:bg-emerald-400 text-black font-black rounded-xl text-xs shadow-lg shadow-smlGreen/20">
                                <i class="fa-solid fa-check mr-1"></i> 儲存戰績並重置助理
                            </button>
                        </div>
                    </form>
                </div>
            </div>
            
            <!-- 分頁 3：歷史紀錄 -->
            <div id="tab-history" class="tab-content hidden">
                <section class="bg-smlCard p-3 sm:p-4 rounded-2xl sml-border space-y-3">
                    <div class="flex justify-between items-center border-b border-gray-800 pb-2">
                        <h3 class="text-xs sm:text-sm font-bold text-white flex items-center">
                            <i class="fa-solid fa-history text-smlCyan mr-1.5"></i> 歷史對局紀錄
                        </h3>
                        <span id="historyCount" class="text-[11px] text-gray-400">共 0 局</span>
                    </div>
                    
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-xs text-gray-400 border-collapse">
                            <thead class="bg-gray-900 text-gray-300 uppercase whitespace-nowrap">
                                <tr>
                                    <th class="py-2.5 px-2">日期</th>
                                    <th class="py-2.5 px-2">順位</th>
                                    <th class="py-2.5 px-2">總金額</th>
                                    <th class="py-2.5 px-2">總點數</th>
                                    <th class="py-2.5 px-2 text-center">操作刪除</th>
                                </tr>
                            </thead>
                            <tbody id="historyTableBody"></tbody>
                        </table>
                    </div>
                </section>
            </div>
        </div>
    </div>
    
    <script>
        const TILE_OPTIONS = {
            "萬子": ["一萬","二萬","三萬","四萬","五萬","六萬","七萬","八萬","九萬"],
            "餅子": ["一餅(大餅)","二餅","三餅","四餅","五餅","六餅","七餅","八餅","九餅"],
            "索子": ["一索(小鳥)","二索","三索","四索","五索","六索","七索","八索","九索"],
            "風牌": ["東","南","西","北"],
            "三元牌": ["白","發","中"]
        };
        const PATTERNS_CATEGORIES = [
            { category: "極限大台 (24/16台)", patterns: [
                { name: "天胡", tai: 24 }, { name: "大四喜", tai: 16 }, { name: "字一色", tai: 16 }
            ]},
            { category: "滿台/役滿等級 (8台)", patterns: [
                { name: "MIGI", tai: 8 }, { name: "哩咕哩咕", tai: 8 }, { name: "清一色", tai: 8 },
                { name: "五暗刻", tai: 8 }, { name: "大三元", tai: 8 }, { name: "小四喜", tai: 8 },
                { name: "七搶一", tai: 8 }, { name: "八仙過海", tai: 8 }
            ]},
            { category: "中階牌型 (5~4台)", patterns: [
                { name: "四暗刻", tai: 5 }, { name: "碰碰胡", tai: 4 }, { name: "混一色", tai: 4 }, { name: "小三元", tai: 4 }
            ]},
            { category: "常見牌型 (3~2台)", patterns: [
                { name: "門前清自摸", tai: 3 }, { name: "三暗刻", tai: 2 }, { name: "全求人", tai: 2 },
                { name: "平胡", tai: 2 }, { name: "骰規", tai: 2 }
            ]},
            { category: "基本台數 (1台/2台)", patterns: [
                { name: "自摸", tai: 1 }, { name: "海底撈月", tai: 1 },
                { name: "槓上自摸", tai: 1 }, { name: "場風", tai: 1 }, 
                { name: "一張花", tai: 1 }, { name: "兩張花", tai: 2 },
                { name: "正字", tai: 1 }, { name: "三元牌", tai: 1 }, { name: "獨聽", tai: 1 },
                { name: "門清", tai: 1 }, { name: "花槓", tai: 1 }, { name: "全紅", tai: 1 }
            ]}
        ];
        
        let records = JSON.parse(localStorage.getItem('mahjong_records')) || [];
        let liveHands = []; 
        let selectedPatterns = [];
        
        let isRayDealer = true; 
        let isAutoTai = false; 
        let isManualTaiOverridden = true; 

        window.onload = function() {
            document.getElementById('inputDate').valueAsDate = new Date();
            initTileDropdowns();
            initPatternButtons();
            loadLiveStateFromStorage();
            window.syncBaseTaiToForm();
            window.updateAll();
            
            const clearBtn = document.getElementById('btnClearAll');
            const clearText = document.getElementById('clearAllText');
            let clearState = false, clearTimer = null;
            clearBtn.onclick = function(e) {
                e.preventDefault();
                if (!clearState) {
                    clearState = true;
                    clearText.innerText = '再次點擊確認清空！';
                    clearBtn.className = 'px-2.5 py-1.5 text-xs bg-red-600 text-white font-black rounded-lg border border-red-400 animate-pulse';
                    clearTimer = setTimeout(() => {
                        clearState = false;
                        clearText.innerText = '清空全部';
                        clearBtn.className = 'px-2.5 py-1.5 text-xs bg-red-950 text-red-400 font-bold rounded-lg border border-red-800/80';
                    }, 3000);
                } else {
                    clearTimeout(clearTimer);
                    localStorage.removeItem('mahjong_records');
                    records = [];
                    window.resetLiveTracker();
                    document.getElementById('recordForm').reset();
                    document.getElementById('inputDate').valueAsDate = new Date();
                    clearState = false;
                    clearText.innerText = '清空全部';
                    clearBtn.className = 'px-2.5 py-1.5 text-xs bg-red-950 text-red-400 font-bold rounded-lg border border-red-800/80';
                    window.updateAll();
                }
            };
        };

        function initTileDropdowns() {
            const winSelect = document.getElementById('liveWinTileSelect');
            const gunSelect = document.getElementById('liveGunTileSelect');
            let html = '<option value="">-- 選牌 --</option>';
            for (const [group, tiles] of Object.entries(TILE_OPTIONS)) {
                html += `<optgroup label="${group}">`;
                tiles.forEach(t => { html += `<option value="${t}">${t}</option>`; });
                html += `</optgroup>`;
            }
            winSelect.innerHTML = html;
            gunSelect.innerHTML = html;
        }

        function initPatternButtons() {
            const container = document.getElementById('patternsContainer');
            container.innerHTML = '';
            PATTERNS_CATEGORIES.forEach(cat => {
                const groupDiv = document.createElement('div');
                groupDiv.className = "space-y-1";
                const catTitle = document.createElement('div');
                catTitle.className = "text-[9px] text-gray-400 font-bold border-b border-gray-800 pb-0.5";
                catTitle.innerText = cat.category;
                groupDiv.appendChild(catTitle);
                const chipsDiv = document.createElement('div');
                chipsDiv.className = "flex flex-wrap gap-1";
                cat.patterns.forEach(p => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'pattern-chip px-2 py-0.5 text-[10px] rounded-lg border border-gray-700 bg-gray-900 text-gray-300 whitespace-nowrap';
                    btn.innerHTML = `${p.name} <span class="text-[9px] opacity-75">(${p.tai}台)</span>`;
                    btn.onclick = () => window.togglePattern(p, btn);
                    chipsDiv.appendChild(btn);
                });
                groupDiv.appendChild(chipsDiv);
                container.appendChild(groupDiv);
            });
        }

        window.toggleRayDealer = function(isDealer) {
            isRayDealer = isDealer;
            const btnD = document.getElementById('btnRayDealer');
            const btnND = document.getElementById('btnRayNonDealer');
            if(isDealer) {
                btnD.className = "px-2 py-1 rounded bg-smlGreen text-black font-bold";
                btnND.className = "px-2 py-1 rounded bg-gray-800 text-gray-400 font-bold";
            } else {
                btnND.className = "px-2 py-1 rounded bg-smlGreen text-black font-bold";
                btnD.className = "px-2 py-1 rounded bg-gray-800 text-gray-400 font-bold";
            }
            saveLiveStateToStorage();
        }

        window.toggleTaiMode = function() {
            isAutoTai = !isAutoTai;
            const btn = document.getElementById('btnTaiMode');
            if (isAutoTai) {
                isManualTaiOverridden = false;
                btn.innerText = "切換: 目前為自動計算台數";
                btn.className = "text-[10px] bg-smlGreen text-black px-2 py-0.5 rounded border border-smlGreen font-bold";
                recalculateAutoTai();
            } else {
                isManualTaiOverridden = true;
                btn.innerText = "切換: 目前為手動輸入";
                btn.className = "text-[10px] bg-gray-800 text-smlCyan px-2 py-0.5 rounded border border-gray-700 font-bold";
            }
        }

        window.togglePattern = function(patternObj, btn) {
            const idx = selectedPatterns.findIndex(item => item.name === patternObj.name);
            if (idx > -1) {
                selectedPatterns.splice(idx, 1);
                btn.classList.remove('active');
            } else {
                selectedPatterns.push(patternObj);
                btn.classList.add('active');
            }
            if (isAutoTai) recalculateAutoTai();
        };

        window.onManualTaiInput = function() {
            if (isAutoTai) window.toggleTaiMode();
            const val = parseInt(document.getElementById('liveTaiInput').value) || 0;
            document.getElementById('autoTaiBadge').innerText = `${val} 台 (自訂)`;
        };

        function recalculateAutoTai() {
            if (isManualTaiOverridden) return;
            let totalTai = 0;
            selectedPatterns.forEach(p => { totalTai += p.tai; });
            document.getElementById('liveTaiInput').value = totalTai;
            document.getElementById('autoTaiBadge').innerText = `${totalTai} 台`;
        }

        window.addLiveHand = function(type) {
            const taiInput = document.getElementById('liveTaiInput');
            const winSelect = document.getElementById('liveWinTileSelect');
            const gunSelect = document.getElementById('liveGunTileSelect');
            const liveBasePts = parseFloat(document.getElementById('liveBasePtsInput').value) || 0;
            const liveTaiPts = parseFloat(document.getElementById('liveTaiPtsInput').value) || 0;
            const liveBaseMoney = parseFloat(document.getElementById('liveBaseMoneyInput').value) || 0;
            const liveTaiMoney = parseFloat(document.getElementById('liveTaiMoneyInput').value) || 0;
            const taiVal = parseInt(taiInput.value) || 0;
            const winTile = winSelect.value;
            const gunTile = gunSelect.value;

            if (type === 'zimo' || type === 'hu') {
                if (isNaN(taiVal) || taiVal < 0) { alert('請輸入有效的台數！'); return; }
                if (!winTile) { alert('請選擇胡牌張！'); return; }
            }
            if (type === 'gun') {
                if (!gunTile) { alert('請選擇放槍牌張！'); return; }
            }

            const snapshotBefore = { isRayDealer };
            let handMoney = 0, handPts = 0;

            if (type === 'zimo') {
                if (isRayDealer) {
                    handMoney = (liveBaseMoney + taiVal * liveTaiMoney) * 3;
                    handPts = (liveBasePts + taiVal * liveTaiPts) * 3;
                } else {
                    handMoney = (liveBaseMoney + taiVal * liveTaiMoney) * 3 + liveTaiMoney;
                    handPts = (liveBasePts + taiVal * liveTaiPts) * 3 + liveTaiPts;
                }
            } else if (type === 'hu') {
                handMoney = liveBaseMoney + taiVal * liveTaiMoney;
                handPts = liveBasePts + taiVal * liveTaiPts;
            } else if (type === 'beZimo') {
                handMoney = -(liveBaseMoney + taiVal * liveTaiMoney);
                handPts = -(liveBasePts + taiVal * liveTaiPts);
            } else if (type === 'gun') {
                handMoney = -(liveBaseMoney + taiVal * liveTaiMoney);
                handPts = -(liveBasePts + taiVal * liveTaiPts);
            } else if (type === 'draw') {
                handMoney = 0; handPts = 0;
            }

            liveHands.push({
                id: Date.now(),
                type,
                tai: isNaN(taiVal) ? 0 : taiVal,
                score: handMoney,
                pts: handPts,
                winTile: (type === 'zimo' || type === 'hu') ? winTile : '',
                gunTile: type === 'gun' ? gunTile : '',
                patterns: selectedPatterns.map(p => p.name),
                snapshotBefore
            });

            selectedPatterns = [];
            document.querySelectorAll('.pattern-chip').forEach(btn => btn.classList.remove('active'));
            winSelect.value = '';
            gunSelect.value = '';
            
            saveLiveStateToStorage();
            updateLiveHandUI();
        };

        window.undoLastLiveHand = function() {
            if (liveHands.length === 0) return;
            const removed = liveHands.pop();
            if (removed && removed.snapshotBefore) {
                window.toggleRayDealer(removed.snapshotBefore.isRayDealer);
            }
            saveLiveStateToStorage();
            updateLiveHandUI();
        };

        window.removeLiveHand = function(index) {
            liveHands.splice(index, 1);
            saveLiveStateToStorage();
            updateLiveHandUI();
        };

        window.resetLiveTracker = function() {
            liveHands = [];
            selectedPatterns = [];
            window.toggleRayDealer(true);
            document.querySelectorAll('.pattern-chip').forEach(btn => btn.classList.remove('active'));
            saveLiveStateToStorage();
            updateLiveHandUI();
        };

        function updateLiveHandUI() {
            const listEl = document.getElementById('liveHandsList');
            const summaryEl = document.getElementById('liveSummary');
            
            if (liveHands.length === 0) {
                listEl.innerHTML = `<div class="text-center text-gray-500 py-2 text-xs">尚未開始紀錄</div>`;
                summaryEl.innerHTML = `手數: <span class="text-white font-bold">0</span> | 點數: <span class="text-smlCyan font-bold">0P</span> | 金額: <span class="text-smlGreen font-bold">$0</span>`;
                return;
            }

            let zimo = 0, hu = 0, gun = 0, beZimo = 0, totalMoney = 0, totalPts = 0, maxWinScore = 0, maxWinPts = 0;
            let html = '';

            liveHands.forEach((h, idx) => {
                let badge = '', scoreText = '';
                if (h.type === 'zimo') {
                    zimo++;
                    badge = `<span class="bg-emerald-950 text-smlGreen border border-smlGreen/40 px-1 py-0.5 rounded text-[10px] font-bold whitespace-nowrap">RAY自摸</span>`;
                    scoreText = `<span class="text-smlGreen font-bold whitespace-nowrap">+$${h.score} (${h.pts}P)</span>`;
                    if (h.score > maxWinScore) maxWinScore = h.score;
                    if (h.pts > maxWinPts) maxWinPts = h.pts;
                } else if (h.type === 'hu') {
                    hu++;
                    badge = `<span class="bg-cyan-950 text-smlCyan border border-smlCyan/40 px-1 py-0.5 rounded text-[10px] font-bold whitespace-nowrap">RAY胡牌</span>`;
                    scoreText = `<span class="text-smlCyan font-bold whitespace-nowrap">+$${h.score} (${h.pts}P)</span>`;
                    if (h.score > maxWinScore) maxWinScore = h.score;
                    if (h.pts > maxWinPts) maxWinPts = h.pts;
                } else if (h.type === 'beZimo') {
                    beZimo++;
                    badge = `<span class="bg-amber-950 text-smlAmber border border-smlAmber/40 px-1 py-0.5 rounded text-[10px] font-bold whitespace-nowrap">RAY被自摸</span>`;
                    scoreText = `<span class="text-smlAmber font-bold whitespace-nowrap">-$${Math.abs(h.score)} (${h.pts}P)</span>`;
                } else if (h.type === 'gun') {
                    gun++;
                    badge = `<span class="bg-red-950 text-smlRed border border-smlRed/40 px-1 py-0.5 rounded text-[10px] font-bold whitespace-nowrap">RAY放槍</span>`;
                    scoreText = `<span class="text-smlRed font-bold whitespace-nowrap">-$${Math.abs(h.score)} (${h.pts}P)</span>`;
                } else {
                    badge = `<span class="bg-gray-800 text-gray-400 px-1 py-0.5 rounded text-[10px] whitespace-nowrap">流局/過手</span>`;
                    scoreText = `<span class="text-gray-400 whitespace-nowrap">$0</span>`;
                }

                totalMoney += h.score;
                totalPts += (h.pts || 0);
                const tileBadge = h.winTile ? `<span class="bg-gray-800 text-smlCyan px-1 py-0.5 rounded text-[9px] whitespace-nowrap">胡:${h.winTile}</span>` : (h.gunTile ? `<span class="bg-gray-800 text-smlRed px-1 py-0.5 rounded text-[9px] whitespace-nowrap">槍:${h.gunTile}</span>` : '');
                const patternsText = (h.patterns && h.patterns.length > 0) ? `<span class="text-gray-400 text-[9px]">(${h.patterns.join(',')})</span>` : '';
                
                html += `
                    <div class="flex items-center justify-between bg-gray-900/90 p-1.5 rounded-lg border border-gray-800 text-xs">
                        <div class="flex items-center space-x-1 flex-wrap gap-y-0.5">
                            <span class="font-mono text-gray-500 text-[10px]">#${idx + 1}</span>
                            ${badge} ${tileBadge} ${patternsText}
                        </div>
                        <div class="flex items-center space-x-2">
                            ${scoreText}
                            <button type="button" onclick="window.removeLiveHand(${idx})" class="text-gray-500 hover:text-red-400 p-1">
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                        </div>
                    </div>
                `;
            });

            listEl.innerHTML = html;
            summaryEl.innerHTML = `手數: <span class="text-white font-bold">${liveHands.length}</span> | 點數: <span class="${totalPts >= 0 ? 'text-smlCyan' : 'text-smlRed'} font-bold">${totalPts >= 0 ? '+' + totalPts : totalPts}P</span> | 金額: <span class="${totalMoney >= 0 ? 'text-smlGreen' : 'text-smlRed'} font-bold">${totalMoney >= 0 ? '+$' + totalMoney : '-$' + Math.abs(totalMoney)}</span>`;
            
            document.getElementById('inputTotalHands').value = liveHands.length;
            document.getElementById('inputZimo').value = zimo;
            document.getElementById('inputHu').value = hu;
            document.getElementById('inputBeZimo').value = beZimo;
            document.getElementById('inputGun').value = gun;
            document.getElementById('inputMoney').value = totalMoney;
            document.getElementById('inputPoints').value = totalPts;
            document.getElementById('inputMaxWinPts').value = maxWinPts;
            document.getElementById('inputMaxWinMoney').value = maxWinScore;
            
            const name1 = document.getElementById('oppName1')?.value || "下家";
            const name2 = document.getElementById('oppName2')?.value || "對家";
            const name3 = document.getElementById('oppName3')?.value || "上家";
            document.getElementById('inputOpponents').value = `${name1}, ${name2}, ${name3}`;
            window.syncBaseTaiToForm();
        }

        window.saveLiveStateToStorage = function() {
            const state = {
                liveHands,
                isRayDealer,
                opp1: document.getElementById('oppName1')?.value || "下家",
                opp2: document.getElementById('oppName2')?.value || "對家",
                opp3: document.getElementById('oppName3')?.value || "上家",
                basePts: document.getElementById('liveBasePtsInput')?.value || 1,
                taiPts: document.getElementById('liveTaiPtsInput')?.value || 1,
                baseMoney: document.getElementById('liveBaseMoneyInput')?.value || 100,
                taiMoney: document.getElementById('liveTaiMoneyInput')?.value || 20
            };
            localStorage.setItem('mahjong_live_state', JSON.stringify(state));
        }

        window.loadLiveStateFromStorage = function() {
            const state = JSON.parse(localStorage.getItem('mahjong_live_state'));
            if (state) {
                liveHands = state.liveHands || [];
                isRayDealer = state.isRayDealer !== undefined ? state.isRayDealer : true;
                if (document.getElementById('oppName1')) document.getElementById('oppName1').value = state.opp1 || "下家";
                if (document.getElementById('oppName2')) document.getElementById('oppName2').value = state.opp2 || "對家";
                if (document.getElementById('oppName3')) document.getElementById('oppName3').value = state.opp3 || "上家";
                if (document.getElementById('liveBasePtsInput')) document.getElementById('liveBasePtsInput').value = state.basePts || 1;
                if (document.getElementById('liveTaiPtsInput')) document.getElementById('liveTaiPtsInput').value = state.taiPts || 1;
                if (document.getElementById('liveBaseMoneyInput')) document.getElementById('liveBaseMoneyInput').value = state.baseMoney || 100;
                if (document.getElementById('liveTaiMoneyInput')) document.getElementById('liveTaiMoneyInput').value = state.taiMoney || 20;
                
                window.toggleRayDealer(isRayDealer);
                updateLiveHandUI();
            }
        }

        window.syncBaseTaiToForm = function() {
            document.getElementById('inputBasePts').value = document.getElementById('liveBasePtsInput').value;
            document.getElementById('inputTaiPts').value = document.getElementById('liveTaiPtsInput').value;
            document.getElementById('inputBaseMoney').value = document.getElementById('liveBaseMoneyInput').value;
            document.getElementById('inputTaiMoney').value = document.getElementById('liveTaiMoneyInput').value;
            saveLiveStateToStorage();
        };

        window.switchTab = function(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('text-smlGreen', 'bg-gray-800', 'border-smlGreen');
                btn.classList.add('text-gray-400', 'border-transparent');
            });
            document.getElementById(tabId).classList.remove('hidden');
            const activeBtn = document.getElementById('btn-' + tabId);
            activeBtn.classList.remove('text-gray-400', 'border-transparent');
            activeBtn.classList.add('text-smlGreen', 'bg-gray-800', 'border-smlGreen');
            
            if (tabId === 'tab-analysis') {
                setTimeout(() => {
                    calculateAndRenderStats();
                    renderCharts();
                }, 50);
            }
        };

        window.updateAll = function() {
            renderTable();
            calculateAndRenderStats();
            renderCharts();
        };

        window.saveRecord = function(e) {
            e.preventDefault();
            const newRecord = {
                id: Date.now(),
                date: document.getElementById('inputDate').value,
                basePts: parseFloat(document.getElementById('inputBasePts').value) || 0,
                taiPts: parseFloat(document.getElementById('inputTaiPts').value) || 0,
                baseMoney: parseFloat(document.getElementById('inputBaseMoney').value) || 0,
                taiMoney: parseFloat(document.getElementById('inputTaiMoney').value) || 0,
                rank: parseInt(document.getElementById('inputRank').value),
                money: parseFloat(document.getElementById('inputMoney').value),
                points: parseFloat(document.getElementById('inputPoints').value),
                hands: parseInt(document.getElementById('inputTotalHands').value) || 0,
                zimo: parseInt(document.getElementById('inputZimo').value) || 0,
                hu: parseInt(document.getElementById('inputHu').value) || 0,
                beZimo: parseInt(document.getElementById('inputBeZimo').value) || 0,
                gun: parseInt(document.getElementById('inputGun').value) || 0,
                maxWinPts: parseInt(document.getElementById('inputMaxWinPts').value) || 0,
                maxWinMoney: parseInt(document.getElementById('inputMaxWinMoney').value) || 0,
                opponents: document.getElementById('inputOpponents').value || '無',
                handsList: [...liveHands]
            };
            records.push(newRecord);
            localStorage.setItem('mahjong_records', JSON.stringify(records));
            window.updateAll();
            
            document.getElementById('recordForm').reset();
            document.getElementById('inputDate').valueAsDate = new Date();
            window.resetLiveTracker();
            alert('戰績儲存成功！');
            window.switchTab('tab-analysis');
        };

        function renderTable() {
            const tbody = document.getElementById('historyTableBody');
            document.getElementById('historyCount').innerText = `共 ${records.length} 局`;
            tbody.innerHTML = '';
            if (records.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-6 text-gray-500">尚無紀錄</td></tr>`;
                return;
            }
            const sorted = [...records].sort((a,b) => new Date(b.date) - new Date(a.date));
            sorted.forEach(r => {
                const tr = document.createElement('tr');
                tr.className = "border-b border-gray-800/80 whitespace-nowrap";
                
                const tdDate = document.createElement('td'); tdDate.className = "py-3 px-2 text-white"; tdDate.innerText = r.date;
                const tdRank = document.createElement('td'); tdRank.className = "py-3 px-2"; tdRank.innerHTML = `<span class="px-1.5 py-0.5 rounded text-[10px] ${r.rank === 1 ? 'bg-smlGreen text-black font-bold' : 'bg-gray-800 text-gray-300'}">${r.rank} 位</span>`;
                const tdMoney = document.createElement('td'); tdMoney.className = `py-3 px-2 font-mono font-bold ${r.money >= 0 ? 'text-smlGreen' : 'text-smlRed'}`; tdMoney.innerText = r.money >= 0 ? '+$'+r.money : '-$'+Math.abs(r.money);
                const tdPts = document.createElement('td'); tdPts.className = `py-3 px-2 font-mono font-bold ${r.points >= 0 ? 'text-smlCyan' : 'text-smlRed'}`; tdPts.innerText = r.points >= 0 ? '+'+r.points+'P' : r.points+'P';
                
                const tdAction = document.createElement('td');
                tdAction.className = "py-3 px-2 text-center";
                const delBtn = document.createElement('button');
                delBtn.type = "button";
                delBtn.className = "bg-red-950 active:bg-red-900 text-red-300 border border-red-800/80 px-2 py-1 rounded-lg text-[11px] font-bold mx-auto transition flex items-center justify-center space-x-1";
                delBtn.innerHTML = `<i class="fa-solid fa-trash-can text-xs"></i><span class="btn-text">刪除</span>`;
                let isArming = false; let armTimer = null;
                delBtn.addEventListener('click', function(e) {
                    if (!isArming) {
                        isArming = true;
                        delBtn.querySelector('.btn-text').innerText = "再點次確認";
                        delBtn.className = "bg-red-600 text-white border border-red-400 px-2 py-1 rounded-lg text-[11px] font-black mx-auto animate-pulse";
                        armTimer = setTimeout(() => {
                            isArming = false;
                            delBtn.querySelector('.btn-text').innerText = "刪除";
                            delBtn.className = "bg-red-950 active:bg-red-900 text-red-300 border border-red-800/80 px-2 py-1 rounded-lg text-[11px] font-bold mx-auto";
                        }, 3000);
                    } else {
                        clearTimeout(armTimer);
                        records = records.filter(rec => String(rec.id) !== String(r.id));
                        localStorage.setItem('mahjong_records', JSON.stringify(records));
                        window.updateAll();
                    }
                });
                tdAction.appendChild(delBtn);
                
                tr.appendChild(tdDate);
                tr.appendChild(tdRank);
                tr.appendChild(tdMoney);
                tr.appendChild(tdPts);
                tr.appendChild(tdAction);
                tbody.appendChild(tr);
            });
        }

        let moneyChartInstance = null, pointsChartInstance = null;
        function calculateAndRenderStats() {
            if (records.length === 0) return;
            const totalGames = records.length;
            const avgRank = (records.reduce((acc, r) => acc + r.rank, 0) / totalGames).toFixed(2);
            const totalHu = records.reduce((acc, r) => acc + (r.hu || 0), 0);
            const totalZimo = records.reduce((acc, r) => acc + (r.zimo || 0), 0);
            const totalBeZimo = records.reduce((acc, r) => acc + (r.beZimo || 0), 0);
            const totalGun = records.reduce((acc, r) => acc + (r.gun || 0), 0);
            const luckVal = 100 + (totalZimo * 15) - (totalBeZimo * 15) + (totalHu * 5) - (totalGun * 5);
            
            document.getElementById('statTotalGames').innerText = totalGames;
            document.getElementById('statAvgRank').innerText = avgRank;
            document.getElementById('statLuckValue').innerText = luckVal;
            document.getElementById('statCareerHu').innerText = totalHu;
            document.getElementById('statCareerZimo').innerText = totalZimo;
            document.getElementById('statCareerBeZimo').innerText = totalBeZimo;
            document.getElementById('statCareerGun').innerText = totalGun;
        }

        function renderCharts() {
            if (records.length === 0) return;
            const sorted = [...records].sort((a,b) => new Date(a.date) - new Date(b.date));
            const labels = sorted.map(r => r.date.substring(5));
            
            let cumM = 0; const cumMoneyData = sorted.map(r => { cumM += r.money; return cumM; });
            let cumP = 0; const cumPtsData = sorted.map(r => { cumP += r.points; return cumP; });

            const ctxM = document.getElementById('moneyLineChart').getContext('2d');
            if (moneyChartInstance) moneyChartInstance.destroy();
            moneyChartInstance = new Chart(ctxM, {
                type: 'line',
                data: { labels: labels, datasets: [{ label: '總金額走勢', data: cumMoneyData, borderColor: '#00ff88', backgroundColor: 'rgba(0, 255, 136, 0.1)', fill: true, tension: 0.3 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });

            const ctxP = document.getElementById('pointsLineChart').getContext('2d');
            if (pointsChartInstance) pointsChartInstance.destroy();
            pointsChartInstance = new Chart(ctxP, {
                type: 'line',
                data: { labels: labels, datasets: [{ label: '總點數走勢', data: cumPtsData, borderColor: '#00e5ff', backgroundColor: 'rgba(0, 229, 255, 0.1)', fill: true, tension: 0.3 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });
        }
    </script>
</body>
</html>
