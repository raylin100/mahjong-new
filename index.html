<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台灣麻將戰績記分板 (Ray 專用盤)</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent-color: #e53935;
      --text-color: #ffffff;
      --subtext-color: #aaaaaa;
      --border-color: #333333;
    }
    body {
      margin: 0; padding: 10px;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .header-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px; border-bottom: 1px solid var(--border-color);
    }
    .game-info { text-align: center; font-size: 14px; color: var(--subtext-color); }
    
    /* 四方牌局羅盤介面 */
    .compass-container {
      position: relative; width: 320px; height: 320px;
      margin: 20px auto; display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows: 1fr 1fr 1fr;
      gap: 5px; align-items: center; justify-items: center;
    }
    .player-box {
      width: 90px; height: 90px; background: var(--card-bg);
      border: 2px solid var(--border-color); border-radius: 8px;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      position: relative; font-size: 14px;
    }
    .player-box.is-dealer { border-color: var(--accent-color); }
    .dealer-badge {
      position: absolute; top: -10px; background: var(--accent-color);
      color: white; font-size: 10px; padding: 2px 6px; border-radius: 4px;
    }
    .player-box input {
      width: 70px; background: transparent; border: none;
      border-bottom: 1px solid #555; color: white; text-align: center;
    }
    
    /* 網格位置指定 */
    #box-top { grid-area: 1 / 2; }
    #box-left { grid-area: 2 / 1; }
    #box-center { grid-area: 2 / 2; border: 1px dashed #555; width: 80px; height: 80px; }
    #box-right { grid-area: 2 / 3; }
    #box-bottom { grid-area: 3 / 2; border-color: #2196f3; }

    /* 按鈕區塊 */
    .action-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
      max-width: 400px; margin: 15px auto;
    }
    button {
      padding: 12px; background: #2c2c2c; color: white;
      border: 1px solid var(--border-color); border-radius: 6px;
      font-size: 15px; font-weight: bold; cursor: pointer;
    }
    button.primary { background: var(--accent-color); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    /* 設定與統計區 */
    .panel {
      max-width: 400px; margin: 15px auto; background: var(--card-bg);
      padding: 15px; border-radius: 8px;
    }
    .pattern-group { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .tag {
      padding: 6px 10px; background: #333; border-radius: 4px;
      font-size: 12px; cursor: pointer; user-select: none;
    }
    .tag.selected { background: #2196f3; color: white; }
    .log-item { font-size: 13px; padding: 6px 0; border-bottom: 1px solid #333; }
  </style>
</head>
<body>

  <div class="header-bar">
    <button onclick="undo()">復原</button>
    <div class="game-info">
      <div id="roundText">東圈 東風局 (連 0)</div>
    </div>
    <button onclick="resetGame()">起莊/重置</button>
  </div>

  <!-- 牌局四方區域 -->
  <div class="compass-container">
    <div class="player-box" id="box-top">
      <span class="dealer-badge" id="badge-0" style="display:none;">莊</span>
      <input type="text" id="name-0" value="玩家 A" onchange="updateNames()">
      <button style="font-size:10px; padding:2px;" onclick="setDealer(0)">設莊</button>
    </div>

    <div class="player-box" id="box-left">
      <span class="dealer-badge" id="badge-3" style="display:none;">莊</span>
      <input type="text" id="name-3" value="玩家 C" onchange="updateNames()">
      <button style="font-size:10px; padding:2px;" onclick="setDealer(3)">設莊</button>
    </div>

    <div class="player-box" id="box-center">
      <div id="currentWind">東</div>
      <div style="font-size: 10px; color:#aaa;" id="dealerStatusText">莊家拉 1 台</div>
    </div>

    <div class="player-box" id="box-right">
      <span class="dealer-badge" id="badge-1" style="display:none;">莊</span>
      <input type="text" id="name-1" value="玩家 B" onchange="updateNames()">
      <button style="font-size:10px; padding:2px;" onclick="setDealer(1)">設莊</button>
    </div>

    <div class="player-box" id="box-bottom">
      <span class="dealer-badge" id="badge-2" style="display:none;">莊</span>
      <strong style="color:#2196f3;">Ray (我)</strong>
      <button style="font-size:10px; padding:2px;" onclick="setDealer(2)">設莊</button>
    </div>
  </div>

  <!-- 戰績總計顯示 -->
  <div class="panel" style="text-align: center;">
    <h3>Ray 目前戰績：<span id="rayTotalScore" style="color:#4caf50;">0</span> 元</h3>
    <div style="font-size: 12px; color: #888;">
      底金: <input type="number" id="baseMoney" value="30" style="width:40px;"> /
      台金: <input type="number" id="taiMoney" value="10" style="width:40px;">
    </div>
  </div>

  <!-- 牌型選擇區 -->
  <div class="panel">
    <div><b>選擇牌型台數 (點擊切換)</b></div>
    <div class="pattern-group" id="patternList"></div>
    <div style="margin-top:8px; font-size:13px;">手動加台：<input type="number" id="manualTai" value="0" style="width:40px;"> 台</div>
  </div>

  <!-- 主要對局動作按鈕 -->
  <div class="action-grid">
    <button class="primary" onclick="handleAction('ray_zimo')">Ray 自摸</button>
    <button class="primary" onclick="handleAction('ray_hu')">Ray 胡牌</button>
    <button onclick="handleAction('ray_gun')">Ray 放槍</button>
    <button onclick="handleAction('ray_bezimo')">Ray 被自摸</button>
    <button onclick="handleAction('safe_other')">不干我的事</button>
    <button onclick="handleAction('draw')">流局</button>
  </div>

  <!-- 紀錄列表 -->
  <div class="panel">
    <b>分數紀錄簿 (僅 Ray)</b>
    <div id="logList"></div>
  </div>

<script>
  // 玩家名單 (2 號固定為 Ray)
  let players = ["玩家 A", "玩家 B", "Ray", "玩家 C"];
  let currentDealer = 0; // 當前莊家索引
  let lianZhuang = 0;    // 連莊次數
  let windCircle = 0;    // 0:東 1:南 2:西 3:北
  let rayScore = 0;
  let historyLogs = [];

  // 保留原牌型，調整正花選項 (不做新增)
  const PATTERNS = [
    { name: "正花 (1張)", tai: 1 },
    { name: "雙正花 (2張)", tai: 2 },
    { name: "門清", tai: 1 },
    { name: "自摸", tai: 1 },
    { name: "風牌", tai: 1 },
    { name: "三元牌", tai: 1 },
    { name: "平胡", tai: 2 },
    { name: "碰碰胡", tai: 4 },
    { name: "清一色", tai: 8 },
    { name: "混一色", tai: 4 }
  ];

  let selectedPatterns = new Set();

  function init() {
    renderPatterns();
    updateUI();
  }

  function renderPatterns() {
    const container = document.getElementById("patternList");
    container.innerHTML = "";
    PATTERNS.forEach((p, idx) => {
      const tag = document.createElement("div");
      tag.className = "tag" + (selectedPatterns.has(idx) ? " selected" : "");
      tag.innerText = `${p.name} (+${p.tai})`;
      tag.onclick = () => {
        if (selectedPatterns.has(idx)) selectedPatterns.delete(idx);
        else selectedPatterns.add(idx);
        renderPatterns();
      };
      container.appendChild(tag);
    });
  }

  function updateNames() {
    players[0] = document.getElementById("name-0").value;
    players[1] = document.getElementById("name-1").value;
    players[3] = document.getElementById("name-3").value;
  }

  function setDealer(idx) {
    currentDealer = idx;
    lianZhuang = 0;
    updateUI();
  }

  function getCalculatedTai() {
    let tai = parseInt(document.getElementById("manualTai").value) || 0;
    selectedPatterns.forEach(idx => tai += PATTERNS[idx].tai);
    return tai;
  }

  function resetPatterns() {
    selectedPatterns.clear();
    document.getElementById("manualTai").value = 0;
    renderPatterns();
  }

  // 核心對局邏輯處理
  function handleAction(action) {
    const base = parseInt(document.getElementById("baseMoney").value) || 0;
    const rate = parseInt(document.getElementById("taiMoney").value) || 0;
    const tai = getCalculatedTai();
    const zhuangTai = 1 + (2 * lianZhuang); // 莊連拉台數
    
    let rayDelta = 0;
    let desc = "";
    const isRayDealer = (currentDealer === 2);

    if (action === "ray_zimo") {
      if (isRayDealer) {
        // Ray 莊家自摸：(底 + 台數 + 莊連拉) * 3
        const single = base + (tai + zhuangTai) * rate;
        rayDelta = single * 3;
        desc = `Ray 莊家自摸 (+${rayDelta})`;
        lianZhuang++;
      } else {
        // Ray 閒家自摸：(底 + 台數)*3 + 莊家1台(含連拉)
        const nonDealerPay = base + tai * rate;
        const dealerPay = base + (tai + zhuangTai) * rate;
        rayDelta = (nonDealerPay * 2) + dealerPay;
        desc = `Ray 閒家自摸 (+${rayDelta})`;
        passDealer();
      }
    } 
    else if (action === "ray_hu") {
      const targetIsDealer = confirm("放槍者是莊家嗎？");
      const effectiveTai = (isRayDealer || targetIsDealer) ? (tai + zhuangTai) : tai;
      rayDelta = base + effectiveTai * rate;
      desc = `Ray 胡牌 (+${rayDelta})`;

      if (isRayDealer) lianZhuang++;
      else passDealer();
    } 
    else if (action === "ray_gun") {
      const winnerIsDealer = confirm("胡牌者是莊家嗎？");
      const effectiveTai = (isRayDealer || winnerIsDealer) ? (tai + zhuangTai) : tai;
      rayDelta = -(base + effectiveTai * rate);
      desc = `Ray 放槍 (${rayDelta})`;

      if (winnerIsDealer) lianZhuang++;
      else passDealer();
    } 
    else if (action === "ray_bezimo") {
      const winnerIsDealer = confirm("自摸者是莊家嗎？");
      const effectiveTai = (isRayDealer || winnerIsDealer) ? (tai + zhuangTai) : tai;
      rayDelta = -(base + effectiveTai * rate);
      desc = `Ray 被自摸 (${rayDelta})`;

      if (winnerIsDealer) lianZhuang++;
      else passDealer();
    } 
    else if (action === "safe_other") {
      rayDelta = 0;
      const dealerWon = confirm("本局是莊家贏/連莊嗎？");
      if (dealerWon) {
        lianZhuang++;
        desc = "他家互胡 (莊家連莊)";
      } else {
        passDealer();
        desc = "他家互胡 (過莊)";
      }
    } 
    else if (action === "draw") {
      rayDelta = 0;
      lianZhuang++;
      desc = "流局 (莊家連莊)";
    }

    // 寫入紀錄
    rayScore += rayDelta;
    historyLogs.unshift({ desc, delta: rayDelta, dealer: currentDealer, lian: lianZhuang });
    resetPatterns();
    updateUI();
  }

  function passDealer() {
    currentDealer = (currentDealer + 1) % 4;
    lianZhuang = 0;
  }

  function undo() {
    if (historyLogs.length === 0) return;
    const last = historyLogs.shift();
    rayScore -= last.delta;
    currentDealer = last.dealer;
    lianZhuang = last.lian;
    updateUI();
  }

  function resetGame() {
    if (!confirm("確定要重置所有局數與分數嗎？")) return;
    rayScore = 0;
    currentDealer = 0;
    lianZhuang = 0;
    historyLogs = [];
    updateUI();
  }

  function updateUI() {
    const winds = ["東", "南", "西", "北"];
    document.getElementById("currentWind").innerText = winds[currentDealer];
    document.getElementById("roundText").innerText = `${winds[windCircle]}圈 ${winds[currentDealer]}風局 (連 ${lianZhuang})`;
    document.getElementById("dealerStatusText").innerText = `莊連拉 ${1 + 2 * lianZhuang} 台`;
    
    // 更新莊家 Badge
    for (let i = 0; i < 4; i++) {
      document.getElementById(`badge-${i}`).style.display = (i === currentDealer) ? "block" : "none";
      const box = document.getElementById(i === 2 ? "box-bottom" : (i === 0 ? "box-top" : (i === 1 ? "box-right" : "box-left")));
      if (i === currentDealer) box.classList.add("is-dealer");
      else box.classList.remove("is-dealer");
    }

    // 更新總分
    const scoreElem = document.getElementById("rayTotalScore");
    scoreElem.innerText = rayScore;
    scoreElem.style.color = rayScore >= 0 ? "#4caf50" : "#f44336";

    // 更新 Log
    const logElem = document.getElementById("logList");
    logElem.innerHTML = historyLogs.map(l => 
      `<div class="log-item">${l.desc} | 變動: <b>${l.delta > 0 ? '+'+l.delta : l.delta}</b></div>`
    ).join("");
  }

  window.onload = init;
</script>
</body>
</html>

    </script>
</body>
</html>
