<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台灣麻將戰績分析系統 (Ray 專用完整版)</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent-color: #e53935;
      --accent-green: #4caf50;
      --accent-blue: #2196f3;
      --text-color: #ffffff;
      --subtext-color: #aaaaaa;
      --border-color: #333333;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding-bottom: 70px;
    }

    /* 頂部導覽列 */
    .top-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 16px; background: #1a1a1a; border-bottom: 1px solid var(--border-color);
      position: sticky; top: 0; z-index: 100;
    }
    .top-title { text-align: center; font-size: 16px; font-weight: bold; }
    .top-subtitle { font-size: 11px; color: var(--subtext-color); }

    /* 頁籤切換 */
    .tab-contents { padding: 12px; max-width: 500px; margin: 0 auto; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* 底部導覽 */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: 60px; background: #181818; border-top: 1px solid var(--border-color);
      display: flex; justify-content: space-around; align-items: center; z-index: 100;
    }
    .nav-btn {
      display: flex; flex-direction: column; align-items: center;
      color: var(--subtext-color); font-size: 11px; background: none; border: none; cursor: pointer;
    }
    .nav-btn.active { color: var(--accent-green); font-weight: bold; }
    .nav-icon { font-size: 18px; margin-bottom: 2px; }

    /* 四方牌局羅盤介面 (如圖設計) */
    .compass-container {
      position: relative; width: 300px; height: 300px;
      margin: 15px auto; display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows: 1fr 1fr 1fr;
      gap: 8px; align-items: center; justify-items: center;
    }
    .player-card {
      width: 90px; height: 90px; background: var(--card-bg);
      border: 2px solid var(--border-color); border-radius: 12px;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      position: relative; font-size: 13px; text-align: center; padding: 4px;
    }
    .player-card.is-dealer { border-color: var(--accent-color); box-shadow: 0 0 8px rgba(229,57,53,0.4); }
    .dealer-badge {
      position: absolute; top: -10px; background: var(--accent-color);
      color: white; font-size: 10px; padding: 1px 6px; border-radius: 4px; font-weight: bold;
    }
    .player-card input {
      width: 75px; background: transparent; border: none;
      border-bottom: 1px solid #555; color: white; text-align: center; font-size: 12px;
    }
    .set-dealer-btn {
      margin-top: 4px; font-size: 10px; padding: 2px 6px;
      background: #333; border: none; color: #ccc; border-radius: 4px; cursor: pointer;
    }

    #seat-top { grid-area: 1 / 2; }
    #seat-left { grid-area: 2 / 1; }
    #seat-center {
      grid-area: 2 / 2; border: 1px dashed #555; width: 85px; height: 85px;
      border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center;
    }
    #seat-right { grid-area: 2 / 3; }
    #seat-bottom { grid-area: 3 / 2; border-color: var(--accent-blue); background: #16222f; }

    /* 區塊面板 */
    .panel {
      background: var(--card-bg); border-radius: 12px; padding: 14px;
      margin-bottom: 12px; border: 1px solid var(--border-color);
    }
    .panel-title { font-size: 14px; font-weight: bold; margin-bottom: 10px; display: flex; justify-content: space-between; }

    /* 按鈕樣式 */
    .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .btn {
      padding: 12px; background: #2a2a2a; color: white; border: 1px solid #444;
      border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; text-align: center;
    }
    .btn-danger { background: var(--accent-color); border-color: #c62828; }
    .btn-primary { background: var(--accent-blue); border-color: #1565c0; }
    .btn-sub { background: #333; border-color: #555; }

    /* 牌型選擇標籤 */
    .pattern-group { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag {
      padding: 6px 10px; background: #2a2a2a; border: 1px solid #444;
      border-radius: 6px; font-size: 12px; cursor: pointer; user-select: none;
    }
    .tag.selected { background: var(--accent-blue); border-color: #64b5f6; color: white; font-weight: bold; }

    /* 紀錄與統計 */
    .log-item {
      padding: 10px; border-bottom: 1px solid #2a2a2a; font-size: 13px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .kpi-card { background: #252525; padding: 12px; border-radius: 8px; text-align: center; }
    .kpi-value { font-size: 18px; font-weight: bold; margin-top: 4px; }

    /* Modal 彈窗 */
    .modal {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7); z-index: 200; justify-content: center; align-items: center;
    }
    .modal-content {
      background: var(--card-bg); width: 85%; max-width: 360px;
      padding: 20px; border-radius: 12px; border: 1px solid var(--border-color);
    }
  </style>
</head>
<body>

  <!-- 頂部列 -->
  <div class="top-bar">
    <button class="btn btn-sub" style="padding:6px 10px; font-size:12px;" onclick="undoLastHand()">↩ 復原</button>
    <div class="top-title">
      <span id="roundTitleText">東圈 東風局</span>
      <div class="top-subtitle" id="dealerSubText">莊家拉 1 台</div>
    </div>
    <button class="btn btn-sub" style="padding:6px 10px; font-size:12px;" onclick="resetMatch()">重置</button>
  </div>

  <div class="tab-contents">
    <!-- 頁籤一：目前牌局 -->
    <div id="tab-board" class="tab-panel active">
      
      <!-- 羅盤視角 -->
      <div class="compass-container">
        <!-- 上家 -->
        <div class="player-card" id="seat-top">
          <span class="dealer-badge" id="badge-0" style="display:none;">莊</span>
          <input type="text" id="name-0" value="玩家 A" onchange="updatePlayerNames()">
          <button class="set-dealer-btn" onclick="setDealer(0)">設莊</button>
        </div>
        <!-- 左家 -->
        <div class="player-card" id="seat-left">
          <span class="dealer-badge" id="badge-3" style="display:none;">莊</span>
          <input type="text" id="name-3" value="玩家 C" onchange="updatePlayerNames()">
          <button class="set-dealer-btn" onclick="setDealer(3)">設莊</button>
        </div>
        <!-- 中央圈風 -->
        <div id="seat-center">
          <div style="font-size: 20px; font-weight: bold; color: var(--accent-color);" id="centerWindText">東</div>
          <button class="btn btn-sub" style="font-size:10px; padding:3px 8px; margin-top:4px;" onclick="handleAction('draw')">流局</button>
        </div>
        <!-- 右家 -->
        <div class="player-card" id="seat-right">
          <span class="dealer-badge" id="badge-1" style="display:none;">莊</span>
          <input type="text" id="name-1" value="玩家 B" onchange="updatePlayerNames()">
          <button class="set-dealer-btn" onclick="setDealer(1)">設莊</button>
        </div>
        <!-- Ray (下方固定) -->
        <div class="player-card" id="seat-bottom">
          <span class="dealer-badge" id="badge-2" style="display:none;">莊</span>
          <strong style="color:var(--accent-blue);">Ray (我)</strong>
          <button class="set-dealer-btn" onclick="setDealer(2)">設莊</button>
        </div>
      </div>

      <!-- Ray 戰績與底台設定 -->
      <div class="panel" style="text-align: center;">
        <div style="font-size:12px; color:var(--subtext-color);">Ray 目前總淨利</div>
        <div style="font-size:28px; font-weight:bold; margin:4px 0;" id="rayScoreDisplay">+0</div>
        <div style="display:flex; justify-content:center; gap:15px; font-size:12px; margin-top:8px;">
          <div>底金: <input type="number" id="baseMoney" value="30" style="width:45px; background:#333; color:#fff; border:none; text-align:center; border-radius:4px;"></div>
          <div>台金: <input type="number" id="taiMoney" value="10" style="width:45px; background:#333; color:#fff; border:none; text-align:center; border-radius:4px;"></div>
        </div>
      </div>

      <!-- 牌型台數選擇 (含正花) -->
      <div class="panel">
        <div class="panel-title">
          <span>選擇牌型 (目前: <span id="currentTaiCount" style="color:var(--accent-blue);">0</span> 台)</span>
        </div>
        <div class="pattern-group" id="patternTagContainer"></div>
        <div style="margin-top:10px; font-size:12px; display:flex; align-items:center; gap:8px;">
          <span>手動加減台數：</span>
          <input type="number" id="manualTaiInput" value="0" style="width:50px; background:#333; color:#fff; border:none; text-align:center; padding:4px; border-radius:4px;" onchange="calculateTai()">
        </div>
      </div>

      <!-- 莊家與 Ray 動作按鈕 -->
      <div class="action-grid">
        <button class="btn btn-primary" onclick="handleAction('ray_zimo')">Ray 自摸</button>
        <button class="btn btn-primary" onclick="handleAction('ray_hu')">Ray 胡牌</button>
        <button class="btn btn-danger" onclick="handleAction('ray_gun')">Ray 放槍</button>
        <button class="btn btn-danger" onclick="handleAction('ray_bezimo')">Ray 被自摸</button>
        <button class="btn btn-sub" style="grid-column: span 2;" onclick="handleAction('safe_other')">不干我的事 (他家勝負)</button>
      </div>

    </div>

    <!-- 頁籤二：牌局紀錄 -->
    <div id="tab-logs" class="tab-panel">
      <div class="panel">
        <div class="panel-title">Ray 歷史分數紀錄簿</div>
        <div id="logsContainer">無歷史紀錄</div>
      </div>
    </div>

    <!-- 頁籤三：數據統計 -->
    <div id="tab-stats" class="tab-panel">
      <div class="kpi-grid">
        <div class="kpi-card">
          <div style="font-size:11px; color:#aaa;">總手數</div>
          <div class="kpi-value" id="statTotalHands">0</div>
        </div>
        <div class="kpi-card">
          <div style="font-size:11px; color:#aaa;">勝率 (胡/自摸)</div>
          <div class="kpi-value" id="statWinRate" style="color:var(--accent-green);">0%</div>
        </div>
        <div class="kpi-card">
          <div style="font-size:11px; color:#aaa;">放槍率</div>
          <div class="kpi-value" id="statGunRate" style="color:var(--accent-color);">0%</div>
        </div>
        <div class="kpi-card">
          <div style="font-size:11px; color:#aaa;">平均胡牌台數</div>
          <div class="kpi-value" id="statAvgTai">0 台</div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-title">Ray 收益走勢圖</div>
        <canvas id="trendChart" width="400" height="200" style="width:100%; height:auto;"></canvas>
      </div>
    </div>
  </div>

  <!-- 對向玩家選擇彈窗 -->
  <div class="modal" id="targetModal">
    <div class="modal-content">
      <h4 id="modalTitle" style="margin-bottom:12px; text-align:center;">請選擇對向玩家</h4>
      <div id="modalTargetBtns" style="display:flex; flex-direction:column; gap:8px;"></div>
    </div>
  </div>

  <!-- 底部頁籤導覽列 -->
  <div class="bottom-nav">
    <button class="nav-btn active" onclick="switchTab('board')">
      <span class="nav-icon">🀄</span>
      <span>目前牌局</span>
    </button>
    <button class="nav-btn" onclick="switchTab('logs')">
      <span class="nav-icon">📋</span>
      <span>牌局紀錄</span>
    </button>
    <button class="nav-btn" onclick="switchTab('stats')">
      <span class="nav-icon">📊</span>
      <span>數據統計</span>
    </button>
  </div>

<script>
  // 核心狀態 variables
  let players = ["玩家 A", "玩家 B", "Ray", "玩家 C"]; // 2 號永遠為 Ray
  let currentDealer = 0; // 0: Top, 1: Right, 2: Bottom(Ray), 3: Left
  let lianZhuang = 0;
  let windCircle = 0; // 0:東, 1:南, 2:西, 3:北
  let rayTotalScore = 0;
  let handHistory = [];

  // 原有牌型清單 (新增正花 1/2 台，無新增其他額外牌型)
  const PATTERNS = [
    { name: "正花 (1台)", tai: 1 },
    { name: "雙正花 (2台)", tai: 2 },
    { name: "門清", tai: 1 },
    { name: "自摸", tai: 1 },
    { name: "風牌", tai: 1 },
    { name: "三元牌", tai: 1 },
    { name: "平胡", tai: 2 },
    { name: "碰碰胡", tai: 4 },
    { name: "清一色", tai: 8 },
    { name: "混一色", tai: 4 },
    { name: "大三元", tai: 8 },
    { name: "小三元", tai: 4 },
    { name: "大四喜", tai: 16 },
    { name: "小四喜", tai: 8 },
    { name: "字一色", tai: 8 },
    { name: "嚦咕嚦咕", tai: 8 },
    { name: "天胡", tai: 16 }
  ];

  let selectedPatternIndexes = new Set();

  function init() {
    renderPatternTags();
    updateUI();
  }

  function renderPatternTags() {
    const container = document.getElementById("patternTagContainer");
    container.innerHTML = "";
    PATTERNS.forEach((p, idx) => {
      const tag = document.createElement("div");
      tag.className = "tag" + (selectedPatternIndexes.has(idx) ? " selected" : "");
      tag.innerText = `${p.name}`;
      tag.onclick = () => {
        if (selectedPatternIndexes.has(idx)) selectedPatternIndexes.delete(idx);
        else selectedPatternIndexes.add(idx);
        renderPatternTags();
        calculateTai();
      };
      container.appendChild(tag);
    });
  }

  function calculateTai() {
    let total = parseInt(document.getElementById("manualTaiInput").value) || 0;
    selectedPatternIndexes.forEach(idx => total += PATTERNS[idx].tai);
    document.getElementById("currentTaiCount").innerText = total;
    return total;
  }

  function resetSelectedPatterns() {
    selectedPatternIndexes.clear();
    document.getElementById("manualTaiInput").value = 0;
    renderPatternTags();
    calculateTai();
  }

  function updatePlayerNames() {
    players[0] = document.getElementById("name-0").value;
    players[1] = document.getElementById("name-1").value;
    players[3] = document.getElementById("name-3").value;
  }

  function setDealer(idx) {
    currentDealer = idx;
    lianZhuang = 0;
    updateUI();
  }

  function passDealer() {
    currentDealer = (currentDealer + 1) % 4;
    lianZhuang = 0;
    if (currentDealer === 0) {
      windCircle = (windCircle + 1) % 4;
    }
  }

  // 對局邏輯處理
  function handleAction(type) {
    const base = parseInt(document.getElementById("baseMoney").value) || 0;
    const rate = parseInt(document.getElementById("taiMoney").value) || 0;
    const tai = calculateTai();
    const zhuangTai = 1 + (2 * lianZhuang);
    const isRayDealer = (currentDealer === 2);

    if (type === 'ray_zimo') {
      let scoreChange = 0;
      if (isRayDealer) {
        // Ray 莊家自摸：(底 + 台數 + 莊連拉) * 3 並連莊
        scoreChange = (base + (tai + zhuangTai) * rate) * 3;
        recordHand("Ray 莊家自摸", scoreChange, true, tai);
        lianZhuang++;
      } else {
        // Ray 閒家自摸：(底 + 台數)*3 + 1台金 (莊家額外付的台金額)
        scoreChange = ((base + tai * rate) * 3) + (zhuangTai * rate);
        recordHand("Ray 閒家自摸", scoreChange, true, tai);
        passDealer();
      }
      postActionUpdate();
    } 
    else if (type === 'ray_hu') {
      openTargetModal("請選擇誰放槍給 Ray", (targetIdx) => {
        const isTargetDealer = (targetIdx === currentDealer);
        const effectiveTai = (isRayDealer || isTargetDealer) ? (tai + zhuangTai) : tai;
        const scoreChange = base + effectiveTai * rate;
        
        recordHand(`Ray 胡牌 (${players[targetIdx]} 放槍)`, scoreChange, true, tai);
        if (isRayDealer) lianZhuang++;
        else passDealer();
        postActionUpdate();
      });
    }
    else if (type === 'ray_gun') {
      openTargetModal("請選擇 Ray 放槍給誰", (targetIdx) => {
        const isWinnerDealer = (targetIdx === currentDealer);
        const effectiveTai = (isRayDealer || isWinnerDealer) ? (tai + zhuangTai) : tai;
        const scoreChange = -(base + effectiveTai * rate);

        recordHand(`Ray 放槍 (給 ${players[targetIdx]})`, scoreChange, false, tai, true);
        if (isWinnerDealer) lianZhuang++;
        else passDealer();
        postActionUpdate();
      });
    }
    else if (type === 'ray_bezimo') {
      openTargetModal("請選擇誰自摸", (winnerIdx) => {
        const isWinnerDealer = (winnerIdx === currentDealer);
        const effectiveTai = (isRayDealer || isWinnerDealer) ? (tai + zhuangTai) : tai;
        const scoreChange = -(base + effectiveTai * rate);

        recordHand(`Ray 被自摸 (${players[winnerIdx]} 自摸)`, scoreChange, false, tai);
        if (isWinnerDealer) lianZhuang++;
        else passDealer();
        postActionUpdate();
      });
    }
    else if (type === 'safe_other') {
      openTargetModal("請選擇此局贏家", (winnerIdx) => {
        const isWinnerDealer = (winnerIdx === currentDealer);
        recordHand(`他家勝負 (${players[winnerIdx]} 勝)`, 0, false, 0);
        if (isWinnerDealer) lianZhuang++;
        else passDealer();
        postActionUpdate();
      });
    }
    else if (type === 'draw') {
      recordHand("流局 (莊家連莊)", 0, false, 0);
      lianZhuang++;
      postActionUpdate();
    }
  }

  function openTargetModal(title, callback) {
    document.getElementById("modalTitle").innerText = title;
    const container = document.getElementById("modalTargetBtns");
    container.innerHTML = "";

    players.forEach((pName, idx) => {
      if (idx === 2 && title.includes("放槍給 Ray")) return; // 胡牌不能選 Ray 自己
      if (idx === 2 && title.includes("Ray 放槍給誰")) return;

      const btn = document.createElement("button");
      btn.className = "btn btn-sub";
      btn.innerText = (idx === currentDealer ? "【莊】" : "") + pName;
      btn.onclick = () => {
        document.getElementById("targetModal").style.display = "none";
        callback(idx);
      };
      container.appendChild(btn);
    });

    document.getElementById("targetModal").style.display = "flex";
  }

  function recordHand(desc, delta, isWin = false, tai = 0, isGun = false) {
    const snap = {
      desc, delta, isWin, tai, isGun,
      dealer: currentDealer,
      lian: lianZhuang,
      wind: windCircle,
      patterns: Array.from(selectedPatternIndexes).map(i => PATTERNS[i].name)
    };
    handHistory.unshift(snap);
    rayTotalScore += delta;
  }

  function postActionUpdate() {
    resetSelectedPatterns();
    updateUI();
  }

  function undoLastHand() {
    if (handHistory.length === 0) return;
    const last = handHistory.shift();
    rayTotalScore -= last.delta;
    currentDealer = last.dealer;
    lianZhuang = last.lian;
    windCircle = last.wind;
    updateUI();
  }

  function resetMatch() {
    if (!confirm("確定要重置所有記錄與戰績嗎？")) return;
    rayTotalScore = 0;
    currentDealer = 0;
    lianZhuang = 0;
    windCircle = 0;
    handHistory = [];
    resetSelectedPatterns();
    updateUI();
  }

  function updateUI() {
    const winds = ["東", "南", "西", "北"];
    document.getElementById("centerWindText").innerText = winds[currentDealer];
    document.getElementById("roundTitleText").innerText = `${winds[windCircle]}圈 ${winds[currentDealer]}風局`;
    document.getElementById("dealerSubText").innerText = `莊家連 ${lianZhuang} (拉 ${1 + 2 * lianZhuang} 台)`;

    // 更新 4 家 莊標籤
    for (let i = 0; i < 4; i++) {
      document.getElementById(`badge-${i}`).style.display = (i === currentDealer) ? "block" : "none";
      const card = document.getElementById(i === 2 ? "seat-bottom" : (i === 0 ? "seat-top" : (i === 1 ? "seat-right" : "seat-left")));
      if (i === currentDealer) card.classList.add("is-dealer");
      else card.classList.remove("is-dealer");
    }

    // 更新 Ray 總分
    const scoreElem = document.getElementById("rayScoreDisplay");
    scoreElem.innerText = (rayTotalScore >= 0 ? "+" : "") + rayTotalScore;
    scoreElem.style.color = rayTotalScore >= 0 ? "var(--accent-green)" : "var(--accent-color)";

    // 更新 Logs
    renderLogs();
    // 更新 Stats
    renderStats();
  }

  function renderLogs() {
    const container = document.getElementById("logsContainer");
    if (handHistory.length === 0) {
      container.innerHTML = "<div style='color:#666; font-size:12px; text-align:center;'>尚無紀錄</div>";
      return;
    }

    container.innerHTML = handHistory.map((h, idx) => `
      <div class="log-item">
        <div>
          <strong>#${handHistory.length - idx} ${h.desc}</strong>
          <div style="font-size:11px; color:#888;">${h.patterns.length > 0 ? h.patterns.join(', ') : '無特別牌型'} (${h.tai}台)</div>
        </div>
        <div style="font-weight:bold; font-size:15px; color:${h.delta > 0 ? 'var(--accent-green)' : (h.delta < 0 ? 'var(--accent-color)' : '#888')};">
          ${h.delta > 0 ? '+' + h.delta : h.delta}
        </div>
      </div>
    `).join("");
  }

  function renderStats() {
    const totalHands = handHistory.length;
    document.getElementById("statTotalHands").innerText = totalHands;

    if (totalHands === 0) {
      document.getElementById("statWinRate").innerText = "0%";
      document.getElementById("statGunRate").innerText = "0%";
      document.getElementById("statAvgTai").innerText = "0 台";
      drawTrendChart([]);
      return;
    }

    const wins = handHistory.filter(h => h.isWin).length;
    const guns = handHistory.filter(h => h.isGun).length;
    const winRate = Math.round((wins / totalHands) * 100);
    const gunRate = Math.round((guns / totalHands) * 100);

    const winHands = handHistory.filter(h => h.isWin);
    const avgTai = winHands.length > 0 ? (winHands.reduce((acc, h) => acc + h.tai, 0) / winHands.length).toFixed(1) : 0;

    document.getElementById("statWinRate").innerText = `${winRate}%`;
    document.getElementById("statGunRate").innerText = `${gunRate}%`;
    document.getElementById("statAvgTai").innerText = `${avgTai} 台`;

    drawTrendChart([...handHistory].reverse());
  }

  function drawTrendChart(data) {
    const canvas = document.getElementById("trendChart");
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (data.length === 0) return;

    let points = [0];
    let curr = 0;
    data.forEach(d => {
      curr += d.delta;
      points.push(curr);
    });

    const maxVal = Math.max(...points, 100);
    const minVal = Math.min(...points, -100);
    const range = maxVal - minVal || 1;

    ctx.beginPath();
    ctx.strokeStyle = "#2196f3";
    ctx.lineWidth = 3;

    points.forEach((pt, idx) => {
      const x = (idx / (points.length - 1)) * (canvas.width - 20) + 10;
      const y = canvas.height - (((pt - minVal) / range) * (canvas.height - 40) + 20);
      if (idx === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    });
    ctx.stroke();
  }

  function switchTab(tabName) {
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    
    document.getElementById(`tab-${tabName}`).classList.add('active');
    event.currentTarget.classList.add('active');
  }

  window.onload = init;
</script>
</body>
